<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baraban - Komandalarga bo'lish</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <h1>🎡 Komandalarga bo'lish</h1>
    <p class="subtitle">Baraban aylanadi, taqdir hal qiladi!</p>

    <!-- 1-QADAM: sonlarni kiritish -->
    <section id="step1">
      <form id="countForm" novalidate>
        <div class="field">
          <label for="peopleCount">Odamlar soni</label>
          <input type="number" id="peopleCount" min="1" placeholder="Masalan: 11" required />
        </div>
        <div class="field">
          <label for="groupCount">Komandalar soni</label>
          <input type="number" id="groupCount" min="1" placeholder="Masalan: 3" required />
        </div>
        <button type="submit" class="btn">Davom etish</button>
      </form>
    </section>

    <!-- 2-QADAM: ismlarni kiritish -->
    <section id="step2" class="hidden">
      <form id="namesForm" novalidate>
        <h2>Odamlarning ismlarini kiriting</h2>
        <div id="nameInputs" class="name-inputs"></div>
        <div class="row">
          <button type="button" id="backBtn" class="btn btn-gray">Orqaga</button>
          <button type="submit" class="btn">Barabanni tayyorlash</button>
        </div>
      </form>
    </section>

    <!-- 3-QADAM: baraban -->
    <section id="step3" class="hidden">
      <div class="wheel-wrap">
        <canvas id="wheel" width="600" height="600"></canvas>
      </div>

      <div class="row">
        <button type="button" id="spinBtn" class="btn btn-spin">🎰 Aylantirish</button>
        <button type="button" id="resetBtn" class="btn btn-gray">Boshidan boshlash</button>
      </div>

      <div id="winnerText" class="winner hidden"></div>

      <div id="teams" class="teams"></div>
    </section>

    <div id="message" class="message hidden"></div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
